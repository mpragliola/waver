<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>waver demo</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #0f1115;
      font-family: 'Google Sans', 'Segoe UI', sans-serif;
    }

    #app {
      max-width: 900px;
      margin: 0 auto;
    }

    wave-r {
      margin-top: 1rem;
    }

    #controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    #controls button,
    #controls select {
      font-family: inherit;
      font-size: 0.85rem;
      color: #e2e8f0;
      background: #1a1d24;
      border: 1px solid #333a47;
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      cursor: pointer;
    }

    #controls button:hover,
    #controls select:hover {
      background: #23272f;
      border-color: #454e5e;
    }

    #controls label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #9aa4b2;
      font-size: 0.85rem;
    }

    #status {
      color: #cbd5e0;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      min-height: 1.2em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(203, 213, 224, 0.3);
      border-top-color: #cbd5e0;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="status"></div>
    <wave-r id="waver"></wave-r>
    <div id="controls">
      <button id="play">Play / Stop</button>
      <button id="zoomFull">Zoom to full</button>
      <button id="viewMode">Toggle spectrogram</button>
      <button id="reset">Reset</button>
      <button id="toggleButtonLabels">Toggle button labels</button>
      <label for="recordViewMode">Record mode:
        <select id="recordViewMode">
          <option value="scroll">scroll</option>
          <option value="zoom-out">zoom-out</option>
          <option value="flat">flat</option>
        </select>
      </label>
      <label for="inputDevice">Input device:
        <select id="inputDevice"></select>
      </label>
    </div>
  </div>
  <script type="module" src="/src/demo/main.ts"></script>
</body>

</html>
